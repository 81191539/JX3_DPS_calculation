<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>天策 DPS 计算器</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111F;
      --surface: #0F1E33;
      --surface-alt: #132746;
      --surface-raised: #182D4D;
      --line: #204365;
      --border: rgba(120, 160, 200, 0.24);
      --border-strong: rgba(120, 200, 220, 0.42);
      --text: #EAF1F7;
      --muted: #9AB4CC;
      --dim: #607A94;
      --accent: #33C7D9;
      --accent-strong: #5FD1A5;
      --success: #22D3A8;
      --warn: #F2B134;
      --bad: #F05A5A;
      --info: #7EA8FF;
      --good-bg: #dbeafe;
      --bar: #33C7D9;
      --radius: 8px;
      font-family: Bahnschrift, Aptos, "Segoe UI", "Microsoft YaHei", sans-serif;
      font-variant-numeric: tabular-nums;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.45;
    }

    header {
      border-bottom: 1px solid var(--border);
      background: rgba(15, 30, 51, 0.96);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .topbar {
      max-width: 1680px;
      margin: 0 auto;
      padding: 14px 20px 10px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px 16px;
      align-items: start;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .subtitle {
      color: var(--muted);
      margin-top: 3px;
      font-size: 12px;
    }

    .system-strip {
      grid-column: 1 / -1;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      padding-top: 2px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 24px;
      padding: 3px 9px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface-alt);
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    .chip::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--dim);
    }

    .chip.live {
      color: var(--text);
      border-color: rgba(34, 211, 168, 0.45);
    }

    .chip.live::before { background: var(--success); }
    .chip.info::before { background: var(--info); }

    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    button {
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface-alt);
      color: var(--text);
      padding: 8px 12px;
      font: inherit;
      cursor: pointer;
      min-height: 36px;
    }

    button:hover {
      border-color: var(--border-strong);
      background: var(--surface-raised);
    }

    button.primary {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
      font-weight: 700;
    }

    button.primary:hover {
      background: var(--accent-strong);
      border-color: var(--accent-strong);
    }

    main {
      max-width: 1680px;
      margin: 0 auto;
      padding: 12px 20px 28px;
      display: grid;
      grid-template-columns: minmax(360px, 430px) minmax(0, 1fr);
      gap: 12px;
      align-items: start;
    }

    section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .inputs, .outputs {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .outputs > .panel:first-child {
      border-color: var(--border-strong);
    }

    .panel {
      padding: 14px 16px;
    }

    .panel h2 {
      margin: 0 0 12px;
      color: var(--text);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .template-controls {
      display: grid;
      grid-template-columns: minmax(120px, 1fr) minmax(140px, 1.2fr);
      gap: 8px;
      margin-bottom: 12px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(19, 39, 70, 0.58);
    }

    .template-actions {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    input, select {
      width: 100%;
      min-height: 34px;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 8px;
      color: var(--text);
      background: var(--surface-alt);
      font: inherit;
    }

    input[readonly], input:disabled {
      background: rgba(19, 39, 70, 0.56);
      color: var(--dim);
      cursor: default;
    }

    input:focus, select:focus {
      outline: 2px solid rgba(51, 199, 217, 0.18);
      border-color: var(--accent);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 28px;
      margin-bottom: 10px;
      color: var(--success);
      font-size: 12px;
      font-weight: 600;
    }

    .status::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: currentColor;
    }

    .status.error { color: var(--bad); }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .metric {
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: var(--radius);
      padding: 12px;
      background: var(--surface-alt);
      min-width: 0;
    }

    .metric:first-child {
      border-left-color: var(--success);
      background: var(--surface-raised);
    }

    .metric .label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    .metric .value {
      margin-top: 4px;
      color: var(--text);
      font-size: 30px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .metric .value.small {
      color: var(--accent);
      font-size: 22px;
    }

    .panel-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .kv {
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      background: var(--surface-alt);
    }

    .kv .k {
      color: var(--muted);
      font-size: 12px;
    }

    .kv .v {
      margin-top: 2px;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .explainable {
      border-bottom: 1px dotted var(--accent);
      cursor: help;
      text-underline-offset: 3px;
    }

    .explainable:focus {
      outline: 2px solid rgba(51, 199, 217, 0.22);
      outline-offset: 2px;
      border-radius: 4px;
    }

    .formula-tooltip {
      position: fixed;
      z-index: 50;
      max-width: min(560px, calc(100vw - 24px));
      padding: 10px 12px;
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      background: #091522;
      color: var(--text);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.34);
      font-size: 12px;
      line-height: 1.55;
      white-space: pre-wrap;
      pointer-events: none;
    }

    .formula-tooltip[hidden] {
      display: none;
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
      background: var(--surface);
    }

    th, td {
      padding: 9px 10px;
      border-bottom: 1px solid rgba(32, 67, 101, 0.72);
      text-align: right;
      white-space: nowrap;
    }

    th {
      color: var(--muted);
      font-weight: 600;
      background: var(--surface-alt);
      position: sticky;
      top: 0;
      z-index: 1;
    }

    th:first-child, td:first-child { text-align: left; }
    tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: rgba(24, 45, 77, 0.62); }

    .ratio-cell {
      min-width: 150px;
    }

    .ratio-track {
      height: 8px;
      background: #0A1729;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 4px;
    }

    .ratio-bar {
      height: 100%;
      background: var(--bar);
      width: 0;
    }

    .skill-counts {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .footnote {
      color: var(--muted);
      font-size: 12px;
      margin-top: 10px;
    }

    @media (max-width: 980px) {
      .topbar, main {
        grid-template-columns: 1fr;
      }

      .toolbar {
        justify-content: flex-start;
      }

      main {
        padding: 14px;
      }

      .outputs {
        order: -1;
      }

      .metrics, .panel-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 560px) {
      .topbar {
        padding: 12px;
      }

      .toolbar {
        display: grid;
        grid-template-columns: 1fr 1fr;
        width: 100%;
      }

      .toolbar .primary {
        grid-column: 1 / -1;
      }

      button {
        min-height: 44px;
      }

      .grid, .skill-counts, .metrics, .panel-grid, .template-controls, .template-actions {
        grid-template-columns: 1fr;
      }

      h1 { font-size: 20px; }
      .metric .value { font-size: 24px; }
      .metric .value.small { font-size: 20px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <div>
        <h1>天策 DPS 计算器</h1>
        <div class="subtitle">离线单页版，默认载入 sample_134，可直接编辑并重新计算。</div>
      </div>
      <div class="toolbar" aria-label="操作">
        <button type="button" class="primary" id="calculateBtn" title="按当前输入计算">= 计算</button>
        <button type="button" id="resetBtn" title="恢复 sample_134 默认值">↺ 重置</button>
        <button type="button" id="exportBtn" title="导出当前输入配置">⇩ 导出 JSON</button>
      </div>
      <div class="system-strip" aria-label="系统状态">
        <span class="chip live">Stable / 本地计算</span>
        <span class="chip info">Simulated / sample_134</span>
        <span class="chip">Offline / 无外部接口</span>
      </div>
    </div>
  </header>

  <main>
    <div class="inputs">
      <section class="panel">
        <h2>基础面板</h2>
        <div class="template-controls" aria-label="基础面板模板">
          <label>模板
            <select id="panelTemplateSlot"></select>
          </label>
          <label>模板名称
            <input id="panelTemplateName" autocomplete="off" maxlength="24">
          </label>
          <div class="template-actions">
            <button type="button" id="savePanelTemplateNameBtn">保存名称</button>
            <button type="button" id="savePanelTemplatePanelBtn">保存面板</button>
            <button type="button" id="resetPanelBtn">重置</button>
          </div>
        </div>
        <div class="grid" id="panelInputs"></div>
      </section>

      <section class="panel">
        <h2>目标与时间</h2>
        <div class="grid">
          <label>目标等级
            <select id="target_level"></select>
          </label>
          <label>战斗时长
            <input id="duration" inputmode="decimal" autocomplete="off">
          </label>
          <label>等级减伤
            <input id="level_reduction" inputmode="decimal" autocomplete="off">
          </label>
        </div>
      </section>

      <section class="panel">
        <h2>傲血与全局增益</h2>
        <div class="grid" id="buffInputs"></div>
      </section>

      <section class="panel">
        <h2>加速档位与技能次数</h2>
        <div class="grid">
          <label>加速档位
            <select id="haste_tier"></select>
          </label>
        </div>
        <div class="footnote" id="hasteNote">技能次数由加速档位固定，不在这里手动编辑。</div>
        <div class="skill-counts" id="countInputs"></div>
      </section>
    </div>

    <div class="outputs">
      <section class="panel">
        <div id="status" class="status">等待计算</div>
        <div class="metrics">
          <div class="metric">
            <div class="label">DPS</div>
            <div class="value" id="dpsOut">-</div>
          </div>
          <div class="metric">
            <div class="label">总伤害</div>
            <div class="value small" id="totalOut">-</div>
          </div>
          <div class="metric">
            <div class="label">无视后防御减伤</div>
            <div class="value small" id="defenseOut">-</div>
          </div>
        </div>
      </section>

      <section class="panel">
        <h2>最终面板</h2>
        <div class="panel-grid" id="finalPanel"></div>
      </section>

      <section class="panel">
        <h2>技能分解</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>技能</th>
                <th>次数</th>
                <th>不会心贡献</th>
                <th>会心贡献</th>
                <th>总伤害</th>
                <th>占比</th>
              </tr>
            </thead>
            <tbody id="breakdownBody"></tbody>
          </table>
        </div>
        <div class="footnote">当前前端复刻已有公式，真实准确性以后续木桩日志校准为准。</div>
      </section>
    </div>
  </main>
  <div id="formulaTooltip" class="formula-tooltip" hidden></div>

  <script>
    (function () {
      "use strict";

      const CRITICAL_STRIKE_SCALE = 239799.331104;
      const CRITICAL_EFFECT_SCALE = 72846.14;
      const OVERCOME_SCALE = 225946.1;
      const STRAIN_SCALE = 133328.82;
      const DEFAULT_TARGET_LEVEL = 134;
      const DEFAULT_DURATION = 180.0;
      const DEFAULT_LEVEL_REDUCTION = 0.0;
      const BASE_STRENGTH_TO_PHYSICAL_AP = 0.15;
      const TIANCE_EXTRA_STRENGTH_TO_PHYSICAL_AP = 1.8;
      const BASE_STRENGTH_TO_PHYSICAL_OVERCOME = 0.28;
      const TIANCE_EXTRA_STRENGTH_TO_PHYSICAL_OVERCOME = 0.28;

      const DEFENSE_COF = {
        131: [44291.70, 11073],
        132: [46582.65, 15528],
        133: [48873.60, 26317],
        134: [155408.88, 83679]
      };

      const DEFAULT_PANEL = {
        strength: 12873,
        base_physical_attack_power: 47035,
        weapon_damage: 10616,
        crit_rating: 35850,
        crit_effect_rating: 8437,
        base_overcome_rating: 57261,
        strain_rating: 88736,
        counter_value: 31107,
        target_level: DEFAULT_TARGET_LEVEL
      };

      const PANEL_TEMPLATE_STORAGE_KEY = "tiance-dps-panel-templates-v1";
      const PANEL_TEMPLATE_SLOTS = 5;

      const DEFAULT_ROTATION_COUNTS = {
        long_ya: 58,
        long_ya_counter: 58,
        liu_xue_tick: 112,
        li_po_wj: 6,
        mie: 19,
        pi_li: 20,
        chuan_yun_1: 15,
        chuan_yun_1_counter: 15,
        chuan_yun_2: 14,
        chuan_yun_2_counter: 14,
        long_yin: 30
      };

      const DEFAULT_HASTE_TIER = "haste_1";
      const HASTE_TIER_ROTATION_COUNTS = {
        haste_1: {
          label: "一段加速",
          available: true,
          counts: DEFAULT_ROTATION_COUNTS
        },
        haste_2: {
          label: "二段加速（待补）",
          available: false,
          counts: null
        }
      };

      const DEFAULT_AOXUE_WU_BUFF = {
        vs_non_player_kd: 0.65,
        ignore_def_pct: 0.60,
        strain_gain_add: 0.00,
        flat_ap_add: 0,
        ap_gain_add: 0.0
      };

      const DEFAULT_GLOBAL_EFFECTS = {
        global_crit_gain: 0.25,
        global_kb_gain: 0.10,
        global_kc_gain: 0.35,
        ap_gain_add: 0.05
      };

      const SKILL_SPECS = {
        chuan_yun_1: { attack_power_cof: 1.84, weapon_damage_cof: 1.00 },
        chuan_yun_2: { attack_power_cof: 2.25, weapon_damage_cof: 1.00 },
        pi_li: { attack_power_cof: 5.03, weapon_damage_cof: 2.00 },
        long_yin: { attack_power_cof: 2.79, weapon_damage_cof: 1.00 },
        mie: { attack_power_cof: 4.51, weapon_damage_cof: 2.00 },
        long_ya: { attack_power_cof: 3.00, weapon_damage_cof: 1.00, k_b: 1.05 },
        li_po_wj: { attack_power_cof: 11.36, weapon_damage_cof: 4.00, k_b: 0.60, critical_strike: 0.25 },
        liu_xue_tick: { attack_power_cof: 3.15 },
        chuan_yun_1_counter: { kind: "counter", counter_cof: 1.10 },
        chuan_yun_2_counter: { kind: "counter", counter_cof: 11.35 },
        long_ya_counter: { kind: "counter", counter_cof: 1.80 }
      };

      const PANEL_FIELDS = [
        ["strength", "力道"],
        ["base_physical_attack_power", "基础外功攻击"],
        ["weapon_damage", "武器伤害"],
        ["crit_rating", "会心评级"],
        ["crit_effect_rating", "会效评级"],
        ["base_overcome_rating", "基础破防评级"],
        ["strain_rating", "无双评级"],
        ["counter_value", "破招值"]
      ];

      const BUFF_FIELDS = [
        ["aoxue.vs_non_player_kd", "对非侠士伤害"],
        ["aoxue.ignore_def_pct", "无视防御"],
        ["aoxue.strain_gain_add", "姿态无双"],
        ["aoxue.flat_ap_add", "固定外功攻击"],
        ["aoxue.ap_gain_add", "姿态攻击增益"],
        ["global.global_crit_gain", "全局会心"],
        ["global.global_kb_gain", "B 乘区"],
        ["global.global_kc_gain", "C 乘区"],
        ["global.ap_gain_add", "全局攻击增益"]
      ];

      const SKILL_LABELS = {
        chuan_yun_1: "穿云一",
        chuan_yun_2: "穿云二",
        pi_li: "霹雳",
        long_yin: "龙吟",
        mie: "灭",
        long_ya: "龙牙",
        li_po_wj: "力破万钧",
        liu_xue_tick: "流血每跳",
        chuan_yun_1_counter: "穿云一破招",
        chuan_yun_2_counter: "穿云二破招",
        long_ya_counter: "龙牙破招"
      };

      function parseNumber(value, fieldName) {
        const raw = String(value ?? "").trim();
        if (!raw) {
          throw new Error(fieldName + " 不能为空");
        }
        const normalized = raw.replace(/,/g, "");
        const parsed = Number(normalized.endsWith("%") ? normalized.slice(0, -1) : normalized);
        if (!Number.isFinite(parsed)) {
          throw new Error(fieldName + " 必须是数字");
        }
        return parsed;
      }

      function parsePercent(value, fieldName) {
        const raw = String(value ?? "").trim();
        const hasPercent = raw.endsWith("%");
        const parsed = parseNumber(raw, fieldName);
        if (hasPercent || Math.abs(parsed) > 1) {
          return parsed / 100;
        }
        return parsed;
      }

      function pctInput(value) {
        return String(value);
      }

      function clone(value) {
        return JSON.parse(JSON.stringify(value));
      }

      function buildDefaultConfig() {
        return {
          panel: clone(DEFAULT_PANEL),
          haste_tier: DEFAULT_HASTE_TIER,
          counts: clone(HASTE_TIER_ROTATION_COUNTS[DEFAULT_HASTE_TIER].counts),
          duration: DEFAULT_DURATION,
          level_reduction: DEFAULT_LEVEL_REDUCTION,
          aoxue: clone(DEFAULT_AOXUE_WU_BUFF),
          global: clone(DEFAULT_GLOBAL_EFFECTS)
        };
      }

      function getCountsForHasteTier(hasteTier) {
        const tier = HASTE_TIER_ROTATION_COUNTS[hasteTier];
        if (!tier) {
          throw new Error("不支持的加速档位：" + hasteTier);
        }
        if (!tier.available || !tier.counts) {
          throw new Error(tier.label + " 的技能次数数据待补");
        }
        return clone(tier.counts);
      }

      function buildAttribute(panel) {
        const level = Number(panel.target_level);
        if (!Object.prototype.hasOwnProperty.call(DEFENSE_COF, level)) {
          throw new Error("不支持的目标等级：" + level);
        }
        const defense = DEFENSE_COF[level];
        const attr = {
          base_agility: 0,
          agility_gain: 1,
          base_strength: Number(panel.strength),
          strength_gain: 1,
          base_physical_attack_power: Number(panel.base_physical_attack_power),
          physical_attack_power_gain: 1,
          base_physical_critical_strike: Number(panel.crit_rating ?? 0),
          physical_critical_strike_gain: 0,
          base_physical_critical_effect: Number(panel.crit_effect_rating ?? 0),
          physical_critical_effect_gain: 0,
          base_physical_overcome: Number(panel.base_overcome_rating ?? 0),
          physical_overcome_gain: 1,
          base_strain: Number(panel.strain_rating ?? 0),
          strain_gain: 0,
          weapon_damage: Number(panel.weapon_damage),
          counter: Number(panel.counter_value ?? 0),
          ignore_defense: 0,
          target_level: level,
          defense_scale: defense[0],
          target_defense: defense[1]
        };
        return attr;
      }

      function strength(attr) {
        return attr.base_strength * attr.strength_gain;
      }

      function attackPower(attr) {
        return attr.base_physical_attack_power * attr.physical_attack_power_gain
          + strength(attr) * BASE_STRENGTH_TO_PHYSICAL_AP
          + strength(attr) * TIANCE_EXTRA_STRENGTH_TO_PHYSICAL_AP;
      }

      function criticalStrike(attr) {
        return attr.base_physical_critical_strike / CRITICAL_STRIKE_SCALE
          + attr.physical_critical_strike_gain
          + attr.base_agility * attr.agility_gain * 0.64;
      }

      function criticalEffect(attr) {
        return 1.75 + attr.base_physical_critical_effect / CRITICAL_EFFECT_SCALE + attr.physical_critical_effect_gain;
      }

      function overcome(attr) {
        return (attr.base_physical_overcome + strength(attr) * BASE_STRENGTH_TO_PHYSICAL_OVERCOME) / OVERCOME_SCALE * attr.physical_overcome_gain
          + strength(attr) * TIANCE_EXTRA_STRENGTH_TO_PHYSICAL_OVERCOME / OVERCOME_SCALE;
      }

      function strain(attr) {
        return attr.base_strain / STRAIN_SCALE + attr.strain_gain;
      }

      function buildSkills() {
        const skills = {};
        Object.keys(SKILL_SPECS).forEach((key) => {
          const spec = Object.assign({
            kind: "skill",
            base_damage: 0,
            weapon_damage_cof: 0,
            attack_power_cof: 0,
            times: 1,
            k_b: 0,
            k_c: 0,
            k_d: 0,
            increasing_k_b: 0,
            increasing_k_c: 0,
            increasing_k_d: 0,
            ignore_defense: 0,
            critical_strike: 0,
            critical_effect: 0,
            counter_cof: 0
          }, SKILL_SPECS[key]);
          skills[key] = spec;
        });
        return skills;
      }

      function applyAoxueWu(attr, skills, buff) {
        attr.base_physical_attack_power += Number(buff.flat_ap_add);
        attr.strain_gain += Number(buff.strain_gain_add);
        attr.ignore_defense += Number(buff.ignore_def_pct);
        attr.physical_attack_power_gain += Number(buff.ap_gain_add);
        Object.values(skills).forEach((skill) => {
          skill.k_d += Number(buff.vs_non_player_kd);
        });
      }

      function applyGlobalEffects(attr, skills, buff) {
        attr.physical_critical_strike_gain += Number(buff.global_crit_gain);
        attr.physical_attack_power_gain += Number(buff.ap_gain_add);
        Object.values(skills).forEach((skill) => {
          skill.k_b += Number(buff.global_kb_gain);
          skill.k_c += Number(buff.global_kc_gain);
        });
      }

      function skillBreakdown(attr, skill) {
        let totalNoncrit = 0;
        let totalCrit = 0;
        let incB = 0;
        let incC = 0;
        let incD = 0;
        const hitExplains = [];
        for (let i = 0; i < Number(skill.times || 1); i += 1) {
          const crit = criticalStrike(attr) + Number(skill.critical_strike || 0);
          const cfx = criticalEffect(attr) + Number(skill.critical_effect || 0);
          const targetDef = Math.max(0, attr.target_defense * (1 - Number(skill.ignore_defense || 0) - attr.ignore_defense));
          const defenseRate = targetDef / (attr.defense_scale + targetDef);
          const kB = Number(skill.k_b || 0) + incB;
          const kC = Number(skill.k_c || 0) + incC;
          const kD = Number(skill.k_d || 0) + incD;
          let base = 0;
          if (skill.kind === "counter") {
            base = attr.counter * Number(skill.counter_cof || 0);
          } else {
            base = Number(skill.base_damage || 0)
              + attackPower(attr) * Number(skill.attack_power_cof || 0)
              + attr.weapon_damage * Number(skill.weapon_damage_cof || 0);
          }
          const baseBeforeMultipliers = base;
          const multiplier = (1 + kB) * (1 + kC) * (1 + kD);
          const postDamageMultiplier = baseBeforeMultipliers * multiplier;
          const postAttributeMultiplier = postDamageMultiplier * (1 + overcome(attr)) * (1 + strain(attr));
          const hit = postAttributeMultiplier * (1 - defenseRate);
          const critDamage = hit * cfx;
          const noncritPart = hit * (1 - crit);
          const critPart = critDamage * crit;
          totalNoncrit += noncritPart;
          totalCrit += critPart;
          hitExplains.push({
            index: i + 1,
            crit,
            cfx,
            targetDef,
            defenseRate,
            kB,
            kC,
            kD,
            baseBeforeMultipliers,
            multiplier,
            postDamageMultiplier,
            postAttributeMultiplier,
            hit,
            critDamage,
            noncritPart,
            critPart
          });
          incB += Number(skill.increasing_k_b || 0);
          incC += Number(skill.increasing_k_c || 0);
          incD += Number(skill.increasing_k_d || 0);
        }
        return {
          noncrit: totalNoncrit,
          crit: totalCrit,
          total: totalNoncrit + totalCrit,
          hits: hitExplains
        };
      }

      function summarizeFinalPanel(attr) {
        const critRate = criticalStrike(attr);
        const critEff = criticalEffect(attr);
        const ov = overcome(attr);
        const st = strain(attr);
        const effectiveTargetDefense = Math.max(0, attr.target_defense * (1 - attr.ignore_defense));
        const defenseRate = effectiveTargetDefense / (attr.defense_scale + effectiveTargetDefense);
        const totalAp = attackPower(attr);
        const str = strength(attr);
        return {
          level: attr.target_level,
          strength: str,
          base_physical_ap: attr.base_physical_attack_power,
          ap_gain: attr.physical_attack_power_gain,
          attack_power_total: totalAp,
          weapon_damage: attr.weapon_damage,
          crit_rate: critRate,
          crit_rating_equiv: critRate * CRITICAL_STRIKE_SCALE,
          crit_effect_total: critEff,
          crit_effect_rating_equiv: (critEff - 1.75) * CRITICAL_EFFECT_SCALE,
          overcome_rate: ov,
          overcome_rating_equiv: ov * OVERCOME_SCALE,
          strain_rate: st,
          strain_rating_equiv: st * STRAIN_SCALE,
          ignore_defense: attr.ignore_defense,
          target_defense: attr.target_defense,
          defense_scale: attr.defense_scale,
          defense_rate_after_ignore: defenseRate,
          explain: {
            attack_power_total: [
              "总外功 = 基础外功 * 攻击增益 + 力道 * (基础外功系数 + 天策额外系数)",
              `${fmtRaw(attr.base_physical_attack_power, 2)} * ${fmtRaw(attr.physical_attack_power_gain, 4)} + ${fmtRaw(str, 2)} * (${fmtRaw(BASE_STRENGTH_TO_PHYSICAL_AP, 2)} + ${fmtRaw(TIANCE_EXTRA_STRENGTH_TO_PHYSICAL_AP, 2)}) = ${fmtRaw(totalAp, 2)}`
            ].join("\n"),
            crit_rate: [
              "会心率 = 会心评级 / 会心系数 + 全局会心 + 身法换算",
              `${fmtRaw(attr.base_physical_critical_strike, 0)} / ${fmtRaw(CRITICAL_STRIKE_SCALE, 1)} + ${fmtRaw(attr.physical_critical_strike_gain, 4)} + ${fmtRaw(attr.base_agility * attr.agility_gain * 0.64, 4)} = ${formatPercent(critRate)}`
            ].join("\n"),
            crit_effect_total: [
              "会效 = 基础会效 + 会效评级 / 会效系数 + 会效增益",
              `1.75 + ${fmtRaw(attr.base_physical_critical_effect, 0)} / ${fmtRaw(CRITICAL_EFFECT_SCALE, 2)} + ${fmtRaw(attr.physical_critical_effect_gain, 4)} = ${fmtRaw(critEff, 4)}`
            ].join("\n"),
            overcome_rate: [
              "破防 = (基础破防评级 + 力道 * 基础破防系数) / 破防系数 * 破防增益 + 力道 * 天策额外破防系数 / 破防系数",
              `(${fmtRaw(attr.base_physical_overcome, 0)} + ${fmtRaw(str, 2)} * ${fmtRaw(BASE_STRENGTH_TO_PHYSICAL_OVERCOME, 2)}) / ${fmtRaw(OVERCOME_SCALE, 1)} * ${fmtRaw(attr.physical_overcome_gain, 4)} + ${fmtRaw(str, 2)} * ${fmtRaw(TIANCE_EXTRA_STRENGTH_TO_PHYSICAL_OVERCOME, 2)} / ${fmtRaw(OVERCOME_SCALE, 1)} = ${formatPercent(ov)}`
            ].join("\n"),
            strain_rate: [
              "无双 = 无双评级 / 无双系数 + 无双增益",
              `${fmtRaw(attr.base_strain, 0)} / ${fmtRaw(STRAIN_SCALE, 2)} + ${fmtRaw(attr.strain_gain, 4)} = ${formatPercent(st)}`
            ].join("\n"),
            defense_rate_after_ignore: [
              "无视后防御减伤 = 有效防御 / (防御系数 + 有效防御)",
              `有效防御 = ${fmtRaw(attr.target_defense, 2)} * (1 - ${fmtRaw(attr.ignore_defense, 4)}) = ${fmtRaw(effectiveTargetDefense, 2)}`,
              `${fmtRaw(effectiveTargetDefense, 2)} / (${fmtRaw(attr.defense_scale, 2)} + ${fmtRaw(effectiveTargetDefense, 2)}) = ${formatPercent(defenseRate)}`
            ].join("\n")
          }
        };
      }

      function buildSkillExplain(attr, skill, breakdown, count, row) {
        const first = breakdown.hits[0];
        const skillName = SKILL_LABELS[row.skill] || row.skill;
        const ap = attackPower(attr);
        const baseLine = skill.kind === "counter"
          ? `破招基础 = 破招值 * 破招系数 = ${fmtRaw(attr.counter, 2)} * ${fmtRaw(skill.counter_cof || 0, 2)} = ${fmtRaw(first.baseBeforeMultipliers, 2)}`
          : `技能基础 = 基础值 + AP * AP系数 + 武伤 * 武伤系数 = ${fmtRaw(skill.base_damage || 0, 2)} + ${fmtRaw(ap, 2)} * ${fmtRaw(skill.attack_power_cof || 0, 2)} + ${fmtRaw(attr.weapon_damage, 2)} * ${fmtRaw(skill.weapon_damage_cof || 0, 2)} = ${fmtRaw(first.baseBeforeMultipliers, 2)}`;
        const common = [
          `${skillName} 单次伤害拆解`,
          baseLine,
          `B/C/D = ${fmtRaw(first.kB, 4)} / ${fmtRaw(first.kC, 4)} / ${fmtRaw(first.kD, 4)}`,
          `乘区 = (1+B)*(1+C)*(1+D) = ${fmtRaw(1 + first.kB, 4)} * ${fmtRaw(1 + first.kC, 4)} * ${fmtRaw(1 + first.kD, 4)} = ${fmtRaw(first.multiplier, 4)}`,
          `属性乘区 = (1+破防)*(1+无双) = ${fmtRaw(1 + overcome(attr), 4)} * ${fmtRaw(1 + strain(attr), 4)}`,
          `防御减伤 = ${fmtRaw(first.targetDef, 2)} / (${fmtRaw(attr.defense_scale, 2)} + ${fmtRaw(first.targetDef, 2)}) = ${formatPercent(first.defenseRate)}`,
          `命中伤害 = ${fmtRaw(first.postAttributeMultiplier, 2)} * (1 - ${fmtRaw(first.defenseRate, 4)}) = ${fmtRaw(first.hit, 2)}`,
          `会心率 = 面板会心 + 技能会心 = ${formatPercent(criticalStrike(attr))} + ${formatPercent(skill.critical_strike || 0)} = ${formatPercent(first.crit)}`,
          `会效 = 面板会效 + 技能会效 = ${fmtRaw(criticalEffect(attr), 4)} + ${fmtRaw(skill.critical_effect || 0, 4)} = ${fmtRaw(first.cfx, 4)}`,
          `次数 ${count}`
        ];
        return {
          noncrit: common.concat([
            `不会心贡献 = 命中伤害 * (1 - 会心率) * 次数`,
            `${fmtRaw(first.hit, 2)} * (1 - ${fmtRaw(first.crit, 4)}) * ${count} = ${fmtRaw(row.noncrit, 2)} (${formatWan(row.noncrit)})`
          ]).join("\n"),
          crit: common.concat([
            `会心贡献 = 命中伤害 * 会效 * 会心率 * 次数`,
            `${fmtRaw(first.hit, 2)} * ${fmtRaw(first.cfx, 4)} * ${fmtRaw(first.crit, 4)} * ${count} = ${fmtRaw(row.crit, 2)} (${formatWan(row.crit)})`
          ]).join("\n"),
          total: common.concat([
            `总伤害 = 不会心贡献 + 会心贡献`,
            `${fmtRaw(row.noncrit, 2)} + ${fmtRaw(row.crit, 2)} = ${fmtRaw(row.total, 2)} (${formatWan(row.total)})`
          ]).join("\n")
        };
      }

      function evaluateConfig(config) {
        const counts = config.haste_tier ? getCountsForHasteTier(config.haste_tier) : config.counts;
        const attr = buildAttribute(config.panel);
        const skills = buildSkills();
        applyAoxueWu(attr, skills, config.aoxue);
        applyGlobalEffects(attr, skills, config.global);
        const rows = [];
        let grand = 0;
        Object.keys(counts).forEach((key) => {
          const count = Math.trunc(Number(counts[key]));
          if (count <= 0) return;
          if (!skills[key]) {
            throw new Error("未知技能：" + key);
          }
          const parts = skillBreakdown(attr, skills[key]);
          const row = {
            skill: key,
            count,
            noncrit: parts.noncrit * count,
            crit: parts.crit * count,
            total: parts.total * count,
            ratio: 0
          };
          row.explain = buildSkillExplain(attr, skills[key], parts, count, row);
          grand += row.total;
          rows.push(row);
        });
        rows.forEach((row) => {
          row.ratio = grand === 0 ? 0 : row.total / grand;
        });
        rows.sort((a, b) => b.total - a.total);
        const dps = grand / Number(config.duration) * (1 - Number(config.level_reduction));
        return {
          name: "frontend",
          haste_tier: config.haste_tier,
          duration: Number(config.duration),
          level_reduction: Number(config.level_reduction),
          panel: summarizeFinalPanel(attr),
          total_damage: grand,
          dps,
          skill_totals: Object.fromEntries(rows.map((row) => [row.skill, row.total])),
          skill_ratios: Object.fromEntries(rows.map((row) => [row.skill, row.ratio])),
          breakdown: rows
        };
      }

      function formatNumber(value, digits) {
        return Number(value).toLocaleString("zh-CN", {
          minimumFractionDigits: digits,
          maximumFractionDigits: digits
        });
      }

      function fmtRaw(value, digits) {
        return Number(value).toLocaleString("zh-CN", {
          useGrouping: false,
          minimumFractionDigits: digits,
          maximumFractionDigits: digits
        });
      }

      function formatWan(value) {
        return formatNumber(Number(value) / 10000, 2) + "万";
      }

      function formatPercent(value) {
        return (Number(value) * 100).toLocaleString("zh-CN", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }) + "%";
      }

      function inputId(key) {
        return "input_" + key.replace(/\./g, "_");
      }

      function makeField(container, key, label, value) {
        const wrapper = document.createElement("label");
        wrapper.textContent = label;
        const input = document.createElement("input");
        input.id = inputId(key);
        input.autocomplete = "off";
        input.inputMode = "decimal";
        input.value = String(value);
        wrapper.appendChild(input);
        container.appendChild(wrapper);
      }

      function makeExplainable(element, explain) {
        element.classList.remove("explainable");
        element.removeAttribute("data-explain");
        element.removeAttribute("tabindex");
        if (!explain) return;
        element.classList.add("explainable");
        element.dataset.explain = explain;
        element.tabIndex = 0;
      }

      function positionTooltip(tooltip, target, event) {
        const rect = target.getBoundingClientRect();
        const baseX = event && Number.isFinite(event.clientX) ? event.clientX : rect.left + rect.width / 2;
        const baseY = event && Number.isFinite(event.clientY) ? event.clientY : rect.bottom;
        let left = baseX + 14;
        let top = baseY + 14;
        const tipRect = tooltip.getBoundingClientRect();
        if (left + tipRect.width > window.innerWidth - 8) {
          left = Math.max(8, window.innerWidth - tipRect.width - 8);
        }
        if (top + tipRect.height > window.innerHeight - 8) {
          top = Math.max(8, baseY - tipRect.height - 14);
        }
        tooltip.style.left = left + "px";
        tooltip.style.top = top + "px";
      }

      function initTooltip() {
        const tooltip = document.getElementById("formulaTooltip");
        let activeTarget = null;

        function show(target, event) {
          if (!target || !target.dataset.explain) return;
          activeTarget = target;
          tooltip.textContent = target.dataset.explain;
          tooltip.hidden = false;
          positionTooltip(tooltip, target, event);
        }

        function hide() {
          activeTarget = null;
          tooltip.hidden = true;
        }

        document.addEventListener("mouseover", (event) => {
          const target = event.target.closest(".explainable");
          if (target) show(target, event);
        });
        document.addEventListener("mousemove", (event) => {
          if (activeTarget) positionTooltip(tooltip, activeTarget, event);
        });
        document.addEventListener("mouseout", (event) => {
          const target = event.target.closest(".explainable");
          if (target && !target.contains(event.relatedTarget)) hide();
        });
        document.addEventListener("focusin", (event) => {
          const target = event.target.closest(".explainable");
          if (target) show(target, null);
        });
        document.addEventListener("focusout", (event) => {
          if (event.target.closest(".explainable")) hide();
        });
        document.addEventListener("click", (event) => {
          const target = event.target.closest(".explainable");
          if (target) {
            show(target, event);
          } else {
            hide();
          }
        });
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape") hide();
        });
      }

      function renderCountPreview(counts) {
        const countContainer = document.getElementById("countInputs");
        countContainer.innerHTML = "";
        Object.keys(DEFAULT_ROTATION_COUNTS).forEach((key) => {
          const wrapper = document.createElement("label");
          wrapper.textContent = SKILL_LABELS[key] || key;
          const input = document.createElement("input");
          input.value = String(counts[key] ?? 0);
          input.readOnly = true;
          input.tabIndex = -1;
          wrapper.appendChild(input);
          countContainer.appendChild(wrapper);
        });
      }

      function defaultPanelTemplateName(slot) {
        return "模板 " + slot;
      }

      function loadPanelTemplates() {
        if (typeof localStorage === "undefined") return {};
        try {
          const raw = localStorage.getItem(PANEL_TEMPLATE_STORAGE_KEY);
          const parsed = raw ? JSON.parse(raw) : {};
          return parsed && typeof parsed === "object" ? parsed : {};
        } catch (error) {
          return {};
        }
      }

      function savePanelTemplates(templates) {
        if (typeof localStorage === "undefined") return;
        localStorage.setItem(PANEL_TEMPLATE_STORAGE_KEY, JSON.stringify(templates));
      }

      function readPanelFieldsFromForm() {
        const panel = {};
        PANEL_FIELDS.forEach(([key, label]) => {
          panel[key] = parseNumber(document.getElementById(inputId("panel." + key)).value, label);
        });
        return panel;
      }

      function setPanelFieldsFromTemplate(panel) {
        PANEL_FIELDS.forEach(([key]) => {
          const value = Object.prototype.hasOwnProperty.call(panel || {}, key) ? panel[key] : DEFAULT_PANEL[key];
          document.getElementById(inputId("panel." + key)).value = String(value);
        });
      }

      function getPanelTemplateSlot() {
        return document.getElementById("panelTemplateSlot").value || "1";
      }

      function renderPanelTemplateOptions() {
        const templates = loadPanelTemplates();
        const select = document.getElementById("panelTemplateSlot");
        const nameInput = document.getElementById("panelTemplateName");
        const selected = select.value || "1";
        select.innerHTML = "";
        for (let slot = 1; slot <= PANEL_TEMPLATE_SLOTS; slot += 1) {
          const key = String(slot);
          const option = document.createElement("option");
          const name = templates[key]?.name || defaultPanelTemplateName(slot);
          option.value = key;
          option.textContent = key + " · " + name;
          select.appendChild(option);
        }
        select.value = String(Math.min(PANEL_TEMPLATE_SLOTS, Math.max(1, Number(selected) || 1)));
        const current = templates[select.value];
        nameInput.value = current?.name || defaultPanelTemplateName(select.value);
      }

      function savePanelTemplateName() {
        const status = document.getElementById("status");
        const slot = getPanelTemplateSlot();
        const nameInput = document.getElementById("panelTemplateName");
        const name = nameInput.value.trim() || defaultPanelTemplateName(slot);
        const templates = loadPanelTemplates();
        const current = templates[slot] || {};
        templates[slot] = {
          name,
          panel: current.panel || clone(DEFAULT_PANEL)
        };
        savePanelTemplates(templates);
        renderPanelTemplateOptions();
        document.getElementById("panelTemplateSlot").value = slot;
        document.getElementById("panelTemplateName").value = name;
        status.className = "status";
        status.textContent = "已保存模板名称：" + name;
      }

      function savePanelTemplatePanel() {
        const status = document.getElementById("status");
        try {
          const slot = getPanelTemplateSlot();
          const templates = loadPanelTemplates();
          const name = templates[slot]?.name || document.getElementById("panelTemplateName").value.trim() || defaultPanelTemplateName(slot);
          templates[slot] = {
            name,
            panel: readPanelFieldsFromForm()
          };
          savePanelTemplates(templates);
          renderPanelTemplateOptions();
          document.getElementById("panelTemplateSlot").value = slot;
          document.getElementById("panelTemplateName").value = name;
          status.className = "status";
          status.textContent = "已保存基础面板：" + name;
        } catch (error) {
          status.className = "status error";
          status.textContent = error.message;
        }
      }

      function loadPanelTemplate() {
        const slot = getPanelTemplateSlot();
        const templates = loadPanelTemplates();
        const template = templates[slot];
        setPanelFieldsFromTemplate(template?.panel || DEFAULT_PANEL);
        document.getElementById("panelTemplateName").value = template?.name || defaultPanelTemplateName(slot);
        calculateAndRender();
      }

      function resetPanelFields() {
        const emptyPanel = {};
        PANEL_FIELDS.forEach(([key]) => {
          emptyPanel[key] = 0;
        });
        setPanelFieldsFromTemplate(emptyPanel);
        calculateAndRender();
      }

      function initPanelTemplates() {
        renderPanelTemplateOptions();
        document.getElementById("panelTemplateSlot").addEventListener("change", loadPanelTemplate);
        document.getElementById("savePanelTemplateNameBtn").addEventListener("click", savePanelTemplateName);
        document.getElementById("savePanelTemplatePanelBtn").addEventListener("click", savePanelTemplatePanel);
        document.getElementById("resetPanelBtn").addEventListener("click", resetPanelFields);
      }

      function initForm() {
        const panelContainer = document.getElementById("panelInputs");
        PANEL_FIELDS.forEach(([key, label]) => makeField(panelContainer, "panel." + key, label, DEFAULT_PANEL[key]));
        initPanelTemplates();

        const targetSelect = document.getElementById("target_level");
        Object.keys(DEFENSE_COF).forEach((level) => {
          const option = document.createElement("option");
          option.value = level;
          option.textContent = level;
          targetSelect.appendChild(option);
        });
        targetSelect.value = String(DEFAULT_TARGET_LEVEL);
        document.getElementById("duration").value = String(DEFAULT_DURATION);
        document.getElementById("level_reduction").value = String(DEFAULT_LEVEL_REDUCTION);

        const buffContainer = document.getElementById("buffInputs");
        BUFF_FIELDS.forEach(([key, label]) => {
          const source = key.startsWith("aoxue.") ? DEFAULT_AOXUE_WU_BUFF : DEFAULT_GLOBAL_EFFECTS;
          const shortKey = key.split(".")[1];
          makeField(buffContainer, key, label, source[shortKey]);
        });

        const hasteSelect = document.getElementById("haste_tier");
        Object.keys(HASTE_TIER_ROTATION_COUNTS).forEach((tierKey) => {
          const tier = HASTE_TIER_ROTATION_COUNTS[tierKey];
          const option = document.createElement("option");
          option.value = tierKey;
          option.textContent = tier.label;
          option.disabled = !tier.available;
          hasteSelect.appendChild(option);
        });
        hasteSelect.value = DEFAULT_HASTE_TIER;
        renderCountPreview(HASTE_TIER_ROTATION_COUNTS[DEFAULT_HASTE_TIER].counts);
      }

      function readConfigFromForm() {
        const panel = readPanelFieldsFromForm();
        panel.target_level = parseNumber(document.getElementById("target_level").value, "目标等级");
        const hasteTier = document.getElementById("haste_tier").value;

        const config = {
          panel,
          haste_tier: hasteTier,
          counts: getCountsForHasteTier(hasteTier),
          duration: parseNumber(document.getElementById("duration").value, "战斗时长"),
          level_reduction: parsePercent(document.getElementById("level_reduction").value, "等级减伤"),
          aoxue: {},
          global: {}
        };

        if (config.duration <= 0) {
          throw new Error("战斗时长必须大于 0");
        }
        if (config.level_reduction < 0 || config.level_reduction >= 1) {
          throw new Error("等级减伤应在 0 到 1 之间");
        }

        BUFF_FIELDS.forEach(([key, label]) => {
          const group = key.startsWith("aoxue.") ? "aoxue" : "global";
          const shortKey = key.split(".")[1];
          const parser = shortKey === "flat_ap_add" ? parseNumber : parsePercent;
          config[group][shortKey] = parser(document.getElementById(inputId(key)).value, label);
        });
        return config;
      }

      function setFormFromConfig(config) {
        setPanelFieldsFromTemplate(config.panel);
        document.getElementById("target_level").value = String(config.panel.target_level);
        document.getElementById("duration").value = String(config.duration);
        document.getElementById("level_reduction").value = pctInput(config.level_reduction);
        BUFF_FIELDS.forEach(([key]) => {
          const group = key.startsWith("aoxue.") ? "aoxue" : "global";
          const shortKey = key.split(".")[1];
          document.getElementById(inputId(key)).value = String(config[group][shortKey]);
        });
        document.getElementById("haste_tier").value = String(config.haste_tier);
        renderCountPreview(config.counts);
      }

      function renderResult(result) {
        const dpsOut = document.getElementById("dpsOut");
        const totalOut = document.getElementById("totalOut");
        const defenseOut = document.getElementById("defenseOut");
        dpsOut.textContent = formatWan(result.dps);
        totalOut.textContent = formatWan(result.total_damage);
        defenseOut.textContent = formatPercent(result.panel.defense_rate_after_ignore);
        makeExplainable(defenseOut, result.panel.explain.defense_rate_after_ignore);

        const panelItems = [
          ["等级", result.panel.level],
          ["力道", formatNumber(result.panel.strength, 2)],
          ["基础外功", formatNumber(result.panel.base_physical_ap, 2)],
          ["总外功", formatNumber(result.panel.attack_power_total, 2), "attack_power_total"],
          ["武伤", formatNumber(result.panel.weapon_damage, 2)],
          ["会心", formatPercent(result.panel.crit_rate), "crit_rate"],
          ["会效", formatNumber(result.panel.crit_effect_total, 4), "crit_effect_total"],
          ["破防", formatPercent(result.panel.overcome_rate), "overcome_rate"],
          ["无双", formatPercent(result.panel.strain_rate), "strain_rate"],
          ["无视防御", formatPercent(result.panel.ignore_defense)],
          ["目标防御", formatNumber(result.panel.target_defense, 2)],
          ["防御系数", formatNumber(result.panel.defense_scale, 2)]
        ];
        const panelContainer = document.getElementById("finalPanel");
        panelContainer.innerHTML = "";
        panelItems.forEach(([key, value, explainKey]) => {
          const item = document.createElement("div");
          item.className = "kv";
          item.innerHTML = "<div class=\"k\"></div><div class=\"v\"></div>";
          item.querySelector(".k").textContent = key;
          const valueNode = item.querySelector(".v");
          valueNode.textContent = String(value);
          makeExplainable(valueNode, explainKey ? result.panel.explain[explainKey] : null);
          panelContainer.appendChild(item);
        });

        const body = document.getElementById("breakdownBody");
        body.innerHTML = "";
        result.breakdown.forEach((row) => {
          const tr = document.createElement("tr");
          const ratioPct = row.ratio * 100;
          tr.innerHTML = [
            "<td></td>",
            "<td></td>",
            "<td></td>",
            "<td></td>",
            "<td></td>",
            "<td class=\"ratio-cell\"><div></div><div class=\"ratio-track\"><div class=\"ratio-bar\"></div></div></td>"
          ].join("");
          const cells = tr.querySelectorAll("td");
          cells[0].textContent = SKILL_LABELS[row.skill] || row.skill;
          cells[1].textContent = String(row.count);
          cells[2].textContent = formatWan(row.noncrit);
          cells[3].textContent = formatWan(row.crit);
          cells[4].textContent = formatWan(row.total);
          makeExplainable(cells[2], row.explain.noncrit);
          makeExplainable(cells[3], row.explain.crit);
          makeExplainable(cells[4], row.explain.total);
          cells[5].querySelector("div").textContent = formatNumber(ratioPct, 2) + "%";
          cells[5].querySelector(".ratio-bar").style.width = Math.max(0, Math.min(100, ratioPct)) + "%";
          body.appendChild(tr);
        });
      }

      function calculateAndRender() {
        const status = document.getElementById("status");
        try {
          const config = readConfigFromForm();
          const result = evaluateConfig(config);
          renderCountPreview(config.counts);
          renderResult(result);
          status.className = "status";
          status.textContent = "已按当前输入计算";
          return { config, result };
        } catch (error) {
          status.className = "status error";
          status.textContent = error.message;
          return null;
        }
      }

      function exportConfig() {
        const current = calculateAndRender();
        if (!current) return;
        const blob = new Blob([JSON.stringify(current.config, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "tiance-dps-config.json";
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      }

      function init() {
        initForm();
        initTooltip();
        setFormFromConfig(buildDefaultConfig());
        document.getElementById("calculateBtn").addEventListener("click", calculateAndRender);
        document.getElementById("resetBtn").addEventListener("click", () => {
          setFormFromConfig(buildDefaultConfig());
          calculateAndRender();
        });
        document.getElementById("exportBtn").addEventListener("click", exportConfig);
        document.querySelectorAll("input, select").forEach((field) => {
          if (field.closest(".template-controls")) return;
          field.addEventListener("change", calculateAndRender);
        });
        calculateAndRender();
      }

      globalThis.TianceDps = {
        DEFENSE_COF,
        DEFAULT_PANEL,
        DEFAULT_ROTATION_COUNTS,
        DEFAULT_HASTE_TIER,
        HASTE_TIER_ROTATION_COUNTS,
        DEFAULT_AOXUE_WU_BUFF,
        DEFAULT_GLOBAL_EFFECTS,
        SKILL_SPECS,
        buildDefaultConfig,
        evaluateConfig
      };

      if (typeof document !== "undefined") {
        document.addEventListener("DOMContentLoaded", init);
      }
    }());
  </script>
</body>
</html>
